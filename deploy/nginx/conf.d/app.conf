# Reverse proxy for the Next.js app, behind Cloudflare's proxy with SSL mode Full (strict).
# The nginx image's /etc/nginx/nginx.conf includes this directory inside its http {} block.

server_tokens off;

# Docker's embedded DNS. With `resolve` below, nginx follows the app container's address when
# `docker compose up -d --build` recreates it, instead of keeping a stale IP until restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app {
    zone app_upstream 64k;
    server app:3000 resolve;
}

# $remote_addr is the visitor (restored by cloudflare-realip.conf); $realip_remote_addr is the
# Cloudflare edge that connected to us.
log_format cloudflare '$remote_addr via $realip_remote_addr [$time_local] "$request" '
                      '$status $body_bytes_sent ${request_time}s "$http_referer" '
                      '"$http_user_agent" cf_ray=$http_cf_ray';

# HTTP: redirect everything to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log cloudflare;

    return 301 https://$host$request_uri;
}

# HTTPS with the Cloudflare Origin Certificate (deploy/certs/README.md).
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log cloudflare;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        # The visitor's IP for the app (rate limiting reads X-Real-IP). Both headers are set to
        # the single restored address, never appended to, so a client can't inject a value.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Don't pass Cloudflare's raw client-IP headers on: a request that bypasses Cloudflare
        # can set them to anything. An empty value removes the header.
        proxy_set_header CF-Connecting-IP  "";
        proxy_set_header True-Client-IP    "";

        # Bulk email sends one batch per request; allow up to 300s. Cloudflare itself ends
        # requests at 100s (error 524) on non-Enterprise plans, so each batch must finish sooner.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream responses (Suspense, Partial Prerendering) instead of buffering whole pages.
        proxy_buffering off;
    }
}
