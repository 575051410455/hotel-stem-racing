# STEM Racing Thailand 2026 registration: app + PostgreSQL 17 + nginx, reached through a
# Cloudflare Tunnel (cloudflared). No port is published on the host (ADR 0005).
# Operator guide: docs/deploy-guide/index.html. All configuration comes from ./.env (a filled-in
# .env.example).
#
#   docker compose up -d --build     # build the app image and (re)start everything
#   docker compose logs -f app       # follow app logs
#
# Never run `docker compose down -v`: -v deletes the database volume and every Registration.

# A fixed project name keeps the volume name (stem-racing_db-data) stable whatever the checkout
# directory is called.
name: stem-racing

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* are inlined at build time, so they are build args, read from ./.env. APP_URL
      # is also read at build time, for the registration pages' hreflang links.
      args:
        APP_URL: ${APP_URL:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_CONTACT_LINE: ${NEXT_PUBLIC_CONTACT_LINE:-}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE:-}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Overrides the localhost DATABASE_URL from .env: inside Compose the database is `db`.
      DATABASE_URL: postgres://${POSTGRES_USER:-stem_racing}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-stem_racing}
    depends_on:
      db:
        condition: service_healthy
    # Reachable only on the Compose network, through nginx.
    expose:
      - "3000"
    stop_grace_period: 30s
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Applied only when the volume is first initialised; see the operator guide before changing.
      POSTGRES_USER: ${POSTGRES_USER:-stem_racing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stem_racing}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: during first-time init Postgres listens on its Unix socket only, so a
      # socket check would report ready before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      - app
    # No published ports: cloudflared reaches nginx on the `tunnel` network, and nginx reaches app
    # on the default one.
    networks:
      - default
      - tunnel
    volumes:
      # Replaces the image's default site with ours; files here are included inside http {}.
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    logging: *logging

  cloudflared:
    # Cloudflare's connector: keeps outbound connections to Cloudflare's edge open and passes each
    # request for the tunnel's public hostname to nginx (the hostname's service: http://nginx:80).
    # The tunnel and its hostname are set up in the Cloudflare dashboard; see the operator guide.
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - nginx
    networks:
      tunnel:
        # nginx trusts CF-Connecting-IP only from this address (deploy/nginx/conf.d/app.conf).
        ipv4_address: 10.203.47.2
    logging: *logging

networks:
  # Only nginx and cloudflared are on it, so cloudflared can reach nginx and nothing else. A fixed
  # subnet gives cloudflared a fixed address. If it overlaps a network already on the server,
  # `docker compose up` says so: pick another private /28 and change app.conf to match.
  tunnel:
    ipam:
      config:
        - subnet: 10.203.47.0/28
          # Automatic addresses (nginx's) come from the upper half, so never clash with cloudflared's.
          ip_range: 10.203.47.8/29

volumes:
  db-data:
